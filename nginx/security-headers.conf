# ---------------------------------------------------------------------------
# Safety headers applied to every response nginx serves.
# ---------------------------------------------------------------------------

# The CSP here is the outer layer. The application sets its own CSP on API
# responses; for documents this is what actually applies.
#
# `script-src` has no 'unsafe-inline': every script is an external module, so
# an injected <script> or inline handler cannot execute. This single line is
# the most effective anti-XSS control in the whole stack.
#
# 'unsafe-inline' appears only for styles, because the design system sets
# dynamic values (avatar colours) via style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' https://cdn.gstatic.com data:; connect-src 'self' wss: https://cdn.jsdelivr.net; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# The legacy XSS auditor causes more harm than good in modern browsers and can
# interact badly with the CSP above, so it is explicitly disabled rather than
# left to browser defaults.
add_header X-XSS-Protection "0" always;

# HSTS. Preload only after the domain is confirmed HTTPS-only — submitting a
# preloadable domain that later serves HTTP bricks it for a year.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
