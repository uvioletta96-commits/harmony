# ---------------------------------------------------------------------------
# Harmony — site configuration
# ---------------------------------------------------------------------------

# Everything is served over TLS. Plain HTTP exists only to redirect, which
# means a mistyped https:// link or an old bookmark still works.
server {
    listen      80;
    listen      [::]:80;
    server_name harmony.example.com;

    # Certbot's challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name harmony.example.com;

    ssl_certificate     /etc/letsencrypt/live/harmony.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harmony.example.com/privkey.pem;

    # TLS 1.2+ only. The old protocol versions are the ones actually broken in
    # practice; the cipher list is the Mozilla "intermediate" set, which still
    # supports older mobile clients.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling removes a client-side round trip on every connection.
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver_timeout     5s;
    resolver             1.1.1.1 1.0.0.1;

    # Uploaded media. Served straight off disk, so the backend is not in the
    # request path for images. `Content-Disposition: inline` plus a strict
    # content type is what stops a stored file from being interpreted as code.
    #
    # `^~` is load-bearing. An uploaded file is almost always .png/.jpg, and
    # the static-asset regex below matches those extensions; regex locations win
    # over prefix ones, so without `^~` every upload 404s against
    # /usr/share/nginx/html instead of reaching this block.
    #
    # No `try_files` here: with `alias` a missing file already 404s, and
    # combining the two resolves the path twice.
    location ^~ /uploads/ {
        alias /srv/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
    }

    # Probes bypass the access log and the rate limiter on the app side.
    location = /healthz { proxy_pass http://backend:8000/healthz; access_log off; }
    location = /readyz  { proxy_pass http://backend:8000/readyz;  access_log off; }

    # Metrics are internal-only. Do not expose them publicly: they reveal
    # traffic shape and error rates to anyone who asks.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://backend:8000/metrics;
        access_log off;
    }

    # The API.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app trusts exactly one proxy hop; this must match
        # TRUSTED_PROXY_COUNT or HTTPS redirection will loop.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # WebSocket. The long read timeout plus a large buffer is what keeps chat
    # from dropping on an idle connection.
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # Interactive API documentation and the OpenAPI document.
    location = /api/docs          { proxy_pass http://backend:8000/api/docs; include /etc/nginx/conf.d/proxy-headers.conf; }
    location = /api/openapi.json  { proxy_pass http://backend:8000/api/openapi.json; include /etc/nginx/conf.d/proxy-headers.conf; }

    # Static assets. Fingerprinted or rarely changing files cache for a year.
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|gif|ico)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The HTML shell must never be cached, or a deploy leaves clients on a
    # stale bundle referencing assets that no longer exist.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
