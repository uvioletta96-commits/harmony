# ---------------------------------------------------------------------------
# nginx — TLS termination, static files, reverse proxy.
#
# One origin for the frontend and the API means cookies stay first-party, CORS
# never enters the picture, and there is a single certificate to manage.
# WebSocket upgrade is forwarded so chat works through the same hostname.
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Deterministic, readable log format. Includes the upstream time and the
    # request id so a slow request can be traced to a log line.
    log_format harmony '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time '
                      'rid=$request_id';

    access_log /var/log/nginx/access.log harmony;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 12m;
    client_body_timeout  30s;
    client_header_timeout 15s;
    send_timeout      60s;

    # Uploads are re-encoded server-side, so long writes are legitimate.
    proxy_request_buffering on;
    proxy_buffering        off;
    proxy_http_version     1.1;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
