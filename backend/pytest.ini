[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --timeout=60
filterwarnings =
    error
    ignore::DeprecationWarning:flask_socketio.*
    ignore::DeprecationWarning:engineio.*
    ignore::DeprecationWarning:socketio.*
    ignore::UserWarning:flask_sqlalchemy.*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: requires PostgreSQL or Redis
