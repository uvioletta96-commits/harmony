{% macro shell(title, body) -%}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#f6f4f1;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4f1;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e6e1db;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="padding:32px 32px 8px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:12px;vertical-align:middle;">
                    <svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                      <path d="M32 5 C44 17 44 35 30 59" stroke="#8d8479" stroke-width="4" stroke-linecap="round"/>
                      <path d="M32 5 C20 17 20 35 34 59" stroke="#b3a794" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                  </td>
                  <td style="font:500 18px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#2c2a27;letter-spacing:0.02em;">
                    {{ app_name }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 8px 32px;font:400 15px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#4a4640;">
              {{ body }}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px 32px 32px;">
              <p style="margin:0;font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#8d8479;">
                Это служебное письмо. Пожалуйста, не отвечайте на него.
              </p>
            </td>
          </tr>
        </table>
        <p style="max-width:560px;margin:16px auto 0;font:400 12px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#a49b8d;">
          © {{ app_name }} · <a href="{{ site_url }}/privacy" style="color:#8d8479;">Политика конфиденциальности</a>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
{%- endmacro %}
